[package]
name = "rie-grep"
version = "0.1.0"
edition = "2024"
description = "Single-binary local AI hybrid code search engine in pure Rust: Tantivy BM25 + Candle Metal/CPU dense vectors + RRF fusion"
license = "MIT"
repository = "https://github.com/dioxuspress/rie-grep"
keywords = ["search", "tantivy", "candle", "bm25", "cli"]
categories = ["command-line-utilities", "text-processing"]

[lib]
name = "rie_grep"
path = "src/lib.rs"

[[bin]]
name = "rie-grep"
path = "src/main.rs"

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[dependencies]
anyhow = "1.0"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
clap = { version = "4.5", features = ["derive"] }
half = "2.6"
ignore = "0.4"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tantivy = "0.27"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
safetensors = "0.4"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
